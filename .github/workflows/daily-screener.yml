name: Daily Screener

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # GitHub cron uses UTC.
    - cron: "0 6 * * 2-5"
    - cron: "0 18 * * 0"
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: data 2
          key: polygon-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            polygon-data-${{ runner.os }}-

      - name: Validate Polygon API key
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          if [ -z "$POLYGON_API_KEY" ]; then
            echo "POLYGON_API_KEY GitHub secret is missing or empty."
            echo "Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Run daily screener
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_BOOTSTRAP_YEARS: ${{ vars.POLYGON_BOOTSTRAP_YEARS || '2' }}
          POLYGON_BACKFILL_DAYS: ${{ vars.POLYGON_BACKFILL_DAYS || '30' }}
          SKIP_PIP_INSTALL: "1"
        run: bash ./run_daily.sh

      - name: Email daily summary
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SUBJECT_PREFIX: ${{ vars.EMAIL_SUBJECT_PREFIX || 'Daily Screener' }}
          EMAIL_ATTACH_RESULTS: ${{ vars.EMAIL_ATTACH_RESULTS || 'true' }}
        run: python send_daily_email.py

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: screener-results
          path: results.xlsx
          if-no-files-found: error

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.xlsx
          if git diff --cached --quiet; then
            echo "No workbook changes to commit."
          else
            git commit -m "Update daily screener results"
            git push
          fi
