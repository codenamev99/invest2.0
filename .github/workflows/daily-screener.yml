name: Daily Screener

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # 8:15 PM Eastern time, Monday–Friday. Keep this in sync with the GitLab
    # schedule (Build > Pipeline schedules there, since GitLab's cron lives on
    # the schedule itself, not in .gitlab-ci.yml) — both hosts should always
    # run at the same wall-clock time.
    - cron: "15 20 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    # The first run has an empty cache, so it bootstraps POLYGON_BOOTSTRAP_YEARS
    # of history for the whole US market before it screens anything. That run
    # is far longer than a cached one and blows the 6-hour GitHub default.
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: data 2
          key: polygon-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            polygon-data-${{ runner.os }}-

      # Says whether the cache came back. An empty count here on a run that is
      # not the first means the cache did not restore and this run will
      # re-bootstrap.
      - name: Report cache status
        run: |
          echo "Cached price files: $(find 'data 2' -name '*.txt' 2>/dev/null | wc -l)"

      # Check every credential up front. The screening run costs an hour of
      # compute, so discovering a missing SMTP secret at the email step means
      # paying for the whole run and still getting no email.
      - name: Validate required secrets
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          missing=""
          for var in POLYGON_API_KEY SMTP_HOST SMTP_USERNAME SMTP_PASSWORD EMAIL_TO; do
            eval "value=\${$var:-}"
            if [ -z "$value" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing GitHub secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Run daily screener
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_BOOTSTRAP_YEARS: ${{ vars.POLYGON_BOOTSTRAP_YEARS || '2' }}
          POLYGON_BACKFILL_DAYS: ${{ vars.POLYGON_BACKFILL_DAYS || '60' }}
          # This remote screens NYSE only. GitLab CI pins its own value, so the
          # two hosts run different universes from identical source.
          SCREEN_UNIVERSE: ${{ vars.SCREEN_UNIVERSE || 'nyse' }}
          SKIP_PIP_INSTALL: "1"
        run: bash ./run_daily.sh

      - name: Email daily summary
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SUBJECT_PREFIX: ${{ vars.EMAIL_SUBJECT_PREFIX || 'Daily Screener' }}
          EMAIL_ATTACH_RESULTS: ${{ vars.EMAIL_ATTACH_RESULTS || 'true' }}
        run: python send_daily_email.py

      - name: Upload results artifact
        # Keep the workbook even when the email step fails, so a bad SMTP
        # setting can be diagnosed without re-running the screener.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-results
          path: results.xlsx
          if-no-files-found: error

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.xlsx
          if git diff --cached --quiet; then
            echo "No workbook changes to commit."
          else
            git commit -m "Update daily screener results"
            git push
          fi
